[workspace]
resolver = "3"
members = ["crates/we-orbit", "crates/we-frames", "crates/we-planet", "crates/we-physics", "crates/we-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.86"

[workspace.dependencies]
# Pinned exactly: changing either can change generated worlds (bit patterns),
# so bump them only together with TERRAIN_VERSION and the golden hashes.
glam = "=0.34.3"
libm = "=0.2.16"
proptest = "1.12"
# Pinned exactly: its voxel shape is new, and the physics tests pin its behaviour.
rapier3d-f64 = "=0.36.1"
we-orbit = { path = "crates/we-orbit" }
we-frames = { path = "crates/we-frames" }
we-planet = { path = "crates/we-planet" }
we-physics = { path = "crates/we-physics" }

[profile.release]
# Keep the default panic = "unwind": we-ffi's guard relies on catching panics.
debug = "line-tables-only"
