# Planning aid for M1f: builds and GameTests draft code from tools/api-probe/overlay/ (copied over the checkout in
# CI only) against the real Minecraft classpath, server and client GameTests included, as the planned CI `mod` job
# will. Not part of the build; deleted once the plan is written.
name: mc-api

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mc-api.yml'
      - 'tools/api-probe/**'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply the draft overlay
        run: cp -rv tools/api-probe/overlay/. . | sed 's#^.*overlay/##'
      - name: Rust checks
        working-directory: core
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Virtual display and software rendering, for the client GameTest
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri mesa-vulkan-drivers
      - name: Build, unit-test and GameTest the draft, client included
        working-directory: mod
        timeout-minutes: 25
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew build runClientGameTest --continue --stacktrace
      - name: Client GameTest screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-screenshots
          path: mod/build/run/clientGameTest/screenshots/
          if-no-files-found: warn
      - name: Test reports and client log on failure
        if: failure()
        working-directory: mod
        run: |
          find build/test-results -name '*.xml' -exec grep -l '<failure' {} \; | while read -r f; do echo "::group::$f"; grep -A15 '<failure' "$f" | head -60; echo "::endgroup::"; done
          find . -name 'latest.log' -path '*clientGameTest*' -exec tail -80 {} \;
