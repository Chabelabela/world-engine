# Planning aid: prints the real Minecraft 26.3 API that the next plan depends on, then
# builds and GameTests draft code from tools/api-probe/overlay/ (copied over the checkout
# in CI only). Not part of the build. Delete it once the plan it serves is written.
# Not part of the build. Safe to delete once the plans it serves are written.
name: mc-api

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mc-api.yml'
      - 'tools/api-probe/**'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Resolve the compile classpath
        working-directory: mod
        run: |
          cat > /tmp/cp.gradle <<'EOF'
          allprojects {
            tasks.register('printCompileClasspath') {
              def cp = project.sourceSets.main.compileClasspath
              doLast { println "CLASSPATH=" + cp.asPath }
            }
          }
          EOF
          ./gradlew --quiet compileJava
          ./gradlew --quiet --init-script /tmp/cp.gradle printCompileClasspath | grep '^CLASSPATH=' | sed 's/^CLASSPATH=//' > /tmp/cp.txt
          tr ':' '\n' < /tmp/cp.txt | grep -i -E 'minecraft|fabric' | sed 's#.*/##' | sort | head -40

      - name: Find the Minecraft jar
        run: |
          for jar in $(tr ':' '\n' < /tmp/cp.txt); do
            if [ -f "$jar" ] && unzip -l "$jar" 2>/dev/null | grep -q 'net/minecraft/world/level/chunk/ChunkGenerator.class'; then
              echo "$jar" > /tmp/mcjar.txt
            fi
          done
          echo "MC jar: $(cat /tmp/mcjar.txt)"
          test -s /tmp/mcjar.txt

      - name: More signatures
        run: |
          MC=$(cat /tmp/mcjar.txt)
          for c in \
            net.minecraft.gametest.framework.GameTestHelper \
            net.minecraft.world.level.storage.SavedDataStorage \
            net.minecraft.world.level.chunk.status.ChunkStatus \
            'net.minecraft.world.level.biome.Climate$Sampler' \
            ; do
            echo "::group::$c"
            javap -p -cp "$MC" "$c" | grep -v 'lambda\$' || echo "MISSING $c"
            echo "::endgroup::"
          done
          show() { echo "=== $1 | $2"; javap -p -cp "$MC" "$1" 2>&1 | grep -E "$2" || echo "(no match)"; }
          show net.minecraft.world.phys.Vec3 ' x\(\)|public final double x'
          show net.minecraft.commands.SharedSuggestionProvider 'static .*suggest\('
          show net.minecraft.world.level.NaturalSpawner 'spawnMobsForChunkGeneration'
          show net.minecraft.server.level.ServerLevel 'getNoiseBiome|getUncachedNoiseBiome|getBiome\('
          show net.minecraft.server.level.WorldGenRegion 'getCenter|getSeed|getMaxY'
          echo "::group::BiomeSource resolvers (bytecode)"
          javap -c -p -cp "$MC" net.minecraft.world.level.biome.BiomeSource | sed -n '/createUncachedResolver(/,/^$/p;/createResolverForChunk(/,/^$/p' | head -80
          echo "::endgroup::"
          echo "::group::ChunkGenerator.doCreateBiomes / getOrigin (bytecode)"
          javap -c -p -cp "$MC" net.minecraft.world.level.chunk.ChunkGenerator | sed -n '/doCreateBiomes(/,/^$/p;/createBiomes(/,/^$/p;/getOrigin(/,/^$/p' | head -90
          echo "::endgroup::"
          echo "::group::FlatLevelSource.buildTerrain (bytecode)"
          javap -c -p -cp "$MC" net.minecraft.world.level.levelgen.FlatLevelSource | sed -n '/buildTerrain(/,/^$/p' | head -120
          echo "::endgroup::"

      - name: Apply the draft overlay
        run: |
          cp -rv tools/api-probe/overlay/. . | sed 's#^.*overlay/##'

      - name: Build and unit-test the draft
        working-directory: mod
        run: ./gradlew build --stacktrace

      - name: List test tasks
        if: always()
        working-directory: mod
        run: ./gradlew tasks --all | grep -i -E 'gametest|^test' || true

      - name: Run the GameTests
        working-directory: mod
        timeout-minutes: 20
        run: ./gradlew runGameTest --stacktrace

      - name: GameTest logs
        if: always()
        working-directory: mod
        run: |
          find . -path ./.gradle -prune -o -name 'latest.log' -print | while read -r f; do echo "::group::$f"; tail -200 "$f"; echo "::endgroup::"; done
          find . -path ./.gradle -prune -o -name 'crash-*.txt' -print | while read -r f; do echo "::group::$f"; head -120 "$f"; echo "::endgroup::"; done
